<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asistente · La Clínica del Celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#000000; --surface:#0e0e0e; --surface2:#161616;
    --linea:#262626; --acento:#e63946; --txt:#ffffff; --txt2:#9a9a9a; --verde:#1d9e75;
  }
  body{background:var(--bg);font-family:Sora,system-ui,sans-serif;color:var(--txt);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

  .topbar{background:linear-gradient(160deg,#000 0%,#0e0e0e 100%);border-bottom:1px solid var(--linea);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .topbar .ava{width:42px;height:42px;border-radius:50%;background:var(--acento);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .topbar .ava svg{width:22px;height:22px}
  .topbar .ti b{font-size:15px;font-weight:700;display:block}
  .topbar .ti span{font-size:12px;color:var(--verde);font-weight:600}
  .topbar .back{margin-left:auto;color:var(--txt2);text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;padding:8px 12px;border:1px solid var(--linea);border-radius:10px}

  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}

  .msg{max-width:86%;display:flex;flex-direction:column}
  .msg.user{align-self:flex-end;align-items:flex-end}
  .msg.bot{align-self:flex-start;align-items:flex-start}
  .bubble{padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
  .msg.user .bubble{background:var(--acento);color:#fff;border-bottom-right-radius:5px}
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--linea);color:var(--txt);border-bottom-left-radius:5px}

  .pcard{background:var(--surface2);border:1px solid var(--linea);border-radius:11px;padding:11px 13px;margin-top:7px}
  .pcard.cm{border-left:3px solid var(--acento)}
  .pcard .pn{font-family:Roboto Mono,monospace;font-weight:600;font-size:13px;line-height:1.3}
  .pcard .pm{font-size:11px;color:var(--txt2);margin-top:3px}
  .pcard .pp{font-size:17px;font-weight:800;color:var(--acento);margin-top:6px}
  .pcard .ps{font-size:11px;font-weight:700;margin-top:3px}
  .ps.ok{color:var(--verde)} .ps.low{color:#ff9800} .ps.no{color:#c0392b}

  .wsp{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:var(--verde);color:#fff;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;text-decoration:none}
  .wsp svg{width:16px;height:16px}

  .sugs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .sug{background:var(--surface);border:1px solid #e6394644;color:#ee8888;border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}
  .sug:active{background:#2a1414}

  .typing{display:flex;gap:5px;padding:13px 15px;background:var(--surface);border:1px solid var(--linea);border-radius:18px;border-bottom-left-radius:5px;width:fit-content}
  .typing span{width:7px;height:7px;border-radius:50%;background:#666;animation:bb 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px);background:var(--acento)}}

  footer{background:#0a0a0a;border-top:1px solid var(--linea);padding:12px 16px;display:flex;gap:9px;flex-shrink:0}
  #inp{flex:1;background:var(--surface2);border:1.5px solid var(--linea);border-radius:24px;padding:12px 18px;color:var(--txt);font-family:Sora;font-size:14px;outline:none}
  #inp:focus{border-color:var(--acento)}
  #inp::placeholder{color:#555}
  #snd{background:var(--acento);border:none;border-radius:50%;width:44px;height:44px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #snd:disabled{background:#444}
</style>
</head>
<body>

<div class="topbar">
  <div class="ava"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10" y1="18.5" x2="14" y2="18.5"/></svg></div>
  <div class="ti"><b>Asistente Virtual</b><span>&#9679; En l&iacute;nea</span></div>
  <a class="back" href="catalogo.html">&larr; Cat&aacute;logo</a>
</div>

<div id="chat"></div>

<footer>
  <input id="inp" type="text" placeholder="Escrib&iacute; tu consulta..." autocomplete="off">
  <button id="snd">&#10148;</button>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmx5IGM5lDDDDD_xrJ1Rmg8FLG3hRWjsE",
  authDomain: "clinica-celular-f6827.firebaseapp.com",
  projectId: "clinica-celular-f6827",
  storageBucket: "clinica-celular-f6827.firebasestorage.app",
  messagingSenderId: "641319344661",
  appId: "1:641319344661:web:5bb06e704088f1a3e1571e"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const WORKER_URL = "https://fancy-sky-b1eb.agustinalejoperez.workers.dev";
const WSP = "5491127999050";

const chat = document.getElementById("chat");
const inp = document.getElementById("inp");
const snd = document.getElementById("snd");

let PRODUCTOS = [];

async function cargar(){
  try{
    const s = await getDoc(doc(db,"clinica","datos"));
    if(s.exists()) PRODUCTOS = s.data().productos || [];
  }catch(e){ console.error("Firebase:",e); }
}

const fmt = n => "$ " + Number(n||0).toLocaleString("es-AR");

function normalizar(t){
  return t.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}

function buscarLocal(texto){
  const t = normalizar(texto);
  const palabras = t.split(" ").filter(p => p.length >= 2);

  const quiereMarco = /(con marco|c\/m|\bcm\b|con m)/i.test(texto);
  const quiereSinMarco = /(sin marco|s\/m|\bsm\b)/i.test(texto);

  const stop = /^(hola|como|estas|que|tal|precio|tienen|tenes|hay|el|la|del|de|un|una|me|decis|cuesta|sale|valor|buenas|dias|tardes|noches|por|para|con|sin|y|o|a)$/;

  const scored = PRODUCTOS.map(p => {
    const hay = normalizar((p.nombre||"") + " " + (p.modelo||"") + " " + (p.categoria||""));
    let score = 0;
    palabras.forEach(pal => {
      if(stop.test(pal)) return;
      if(hay.includes(pal)) score += pal.length;
    });
    return {p, score};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);

  if(scored.length === 0) return null;

  let resultados = scored.map(x => x.p);

  if(quiereMarco){
    const conM = resultados.filter(p => p.marco);
    if(conM.length) resultados = conM;
  } else if(quiereSinMarco){
    const sinM = resultados.filter(p => !p.marco);
    if(sinM.length) resultados = sinM;
  }

  return resultados.slice(0, 4);
}

function addUser(t){
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = '<div class="bubble">'+t+'</div>';
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

function addBot(html){
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = '<div class="bubble">'+html+'</div>';
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

function typing(on){
  let t = document.getElementById("typ");
  if(on && !t){
    const d = document.createElement("div");
    d.className = "msg bot"; d.id = "typ";
    d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  } else if(!on && t){ t.remove(); }
}

function tarjetaProducto(p){
  const ag = p.stock === 0;
  const sClass = ag ? "no" : p.stock <= 2 ? "low" : "ok";
  const sLabel = ag ? "\u2717 Sin stock" : p.stock <= 2 ? "\u26a0 \u00daltimas "+p.stock+" unidades" : "\u2713 "+p.stock+" en stock";
  return '<div class="pcard '+(p.marco?'cm':'')+'">'+
    '<div class="pn">'+p.nombre+'</div>'+
    '<div class="pm">'+p.categoria+' \u00b7 '+(p.marco?'Con marco':'Sin marco')+'</div>'+
    (ag ? '' : '<div class="pp">'+fmt(p.precio)+'</div>')+
    '<div class="ps '+sClass+'">'+sLabel+'</div>'+
  '</div>';
}

function linkWsp(prods, consulta){
  const det = prods.filter(p=>p.stock>0).map(p => '\u2022 '+p.nombre+' ('+(p.marco?'c/marco':'s/marco')+') \u2014 '+fmt(p.precio)).join("\n");
  const msg = "Hola! Consult\u00e9 por: "+consulta+"\n\nMe interesa:\n"+det;
  return "https://wa.me/"+WSP+"?text="+encodeURIComponent(msg);
}

const wspSvg = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z"/></svg>';

function responderLocal(prods, texto){
  let html;
  const disponibles = prods.filter(p => p.stock > 0);

  if(disponibles.length === 0){
    html = "Justo eso lo tenemos sin stock en este momento \ud83d\ude15 Escribinos por WhatsApp y te avisamos cuando entre.";
    prods.forEach(p => html += tarjetaProducto(p));
  } else if(prods.length === 1){
    const p = prods[0];
    html = "\u00a1S\u00ed! Tenemos el <b>"+p.nombre+"</b> "+(p.marco?'con marco':'sin marco')+" a <b>"+fmt(p.precio)+"</b> \ud83d\udc47";
    html += tarjetaProducto(p);
    html += '<a class="wsp" href="'+linkWsp(prods,texto)+'" target="_blank">'+wspSvg+'Pedir por WhatsApp</a>';
  } else {
    html = "Encontr\u00e9 esto que puede servirte \ud83d\udc47";
    prods.forEach(p => html += tarjetaProducto(p));
    html += '<a class="wsp" href="'+linkWsp(prods,texto)+'" target="_blank">'+wspSvg+'Consultar por WhatsApp</a>';
  }
  return html;
}

async function responderIA(texto){
  const muestras = PRODUCTOS.slice(0, 15).map(p => p.nombre).join(", ");
  const prompt = 'Sos el asistente amable de "La Cl\u00ednica del Celular", local de repuestos de celulares en Ituzaing\u00f3 469, Pilar. WhatsApp 11 2799-9050. Categor\u00edas: m\u00f3dulos, bater\u00edas, placas de carga. Algunos modelos: '+muestras+'. Habl\u00e1s en espa\u00f1ol rioplatense (tuteo), breve y cordial. El cliente escribi\u00f3: "'+texto+'". Respond\u00e9 en 1-2 oraciones. Si pregunta por un producto puntual, pedile que escriba el modelo (ej: "A03 core con marco").';

  try{
    const r = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ messages:[{role:"user",content:prompt}] })
    });
    const d = await r.json();
    const txt = (d.content && d.content[0] && d.content[0].text) || (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts[0].text);
    if(txt && txt.trim() && txt.trim() !== "{}") return txt.trim();
  }catch(e){ console.error("IA:",e); }

  return "\u00a1Hola! \ud83d\udc4b Decime qu\u00e9 repuesto buscás (el modelo del celu) y te paso precio y stock al toque.";
}

async function enviar(){
  const texto = inp.value.trim();
  if(!texto || snd.disabled) return;
  addUser(texto);
  inp.value = "";
  snd.disabled = true;
  typing(true);

  const prods = buscarLocal(texto);

  if(prods){
    setTimeout(() => {
      typing(false);
      addBot(responderLocal(prods, texto));
      snd.disabled = false; inp.focus();
    }, 350);
  } else {
    const resp = await responderIA(texto);
    typing(false);
    addBot(resp);
    snd.disabled = false; inp.focus();
  }
}

inp.addEventListener("keydown", e => { if(e.key==="Enter") enviar(); });
snd.addEventListener("click", enviar);
window.usarSug = t => { inp.value = t; enviar(); };

(async () => {
  await cargar();
  addBot('\u00a1Hola! \ud83d\udc4b Soy el asistente de <b>La Cl\u00ednica del Celular</b>.<br><br>Preguntame por cualquier repuesto y te digo precio y stock al instante.'+
    '<div class="sugs">'+
      '<span class="sug" onclick="usarSug(\'precio del A03 core con marco\')">A03 core c/marco</span>'+
      '<span class="sug" onclick="usarSug(\'bater\u00eda A04\')">Bater\u00eda A04</span>'+
      '<span class="sug" onclick="usarSug(\'m\u00f3dulo A15\')">M\u00f3dulo A15</span>'+
    '</div>');
})();
</script>
</body>
</html>

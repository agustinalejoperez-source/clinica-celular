<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --rojo:#e63946; --rojo2:#c1121f; --celeste:#e63946;
    --bg:#000000; --surface:#0e0e0e; --surface2:#161616;
    --linea:#262626; --acento:#e63946; --txt:#ffffff; --txt2:#9a9a9a;
  }
  body{background:var(--bg);font-family:Sora,system-ui,sans-serif;color:var(--txt);padding-bottom:84px}
  .loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:999}
  .spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#e63946;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{max-width:880px;margin:0 auto;min-height:100vh}

  /* Hero premium */
  .hero{background:linear-gradient(160deg,#000 0%,#0e0e0e 100%);padding:28px 22px 24px;text-align:center;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
  .hero img{height:150px;width:auto;background:none;border-radius:0;padding:0;box-shadow:none}
  .hero h1{margin-top:14px;font-size:21px;font-weight:800;color:#fff;letter-spacing:.4px}
  .hero .tag{margin-top:5px;font-size:10px;color:#b8b8b8;letter-spacing:4px;font-weight:600}
  .hero .contact{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .hero .contact a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:11px}
  .c-wsp{background:#1d9e75;color:#fff}
  .c-loc{background:rgba(255,255,255,.12);color:#dcebff;color:#e8f3fb;border:1px solid rgba(255,255,255,.2)}

  /* Buscador + chips */
  .tools{position:sticky;top:0;z-index:60;background:var(--bg);padding:13px 16px 10px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .search{width:100%;background:var(--surface);border:1.5px solid var(--linea);border-radius:13px;padding:13px 16px;font-family:Sora;font-size:15px;color:var(--txt);outline:none}
  .search:focus{border-color:var(--acento)}
  .chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
  .chip{flex-shrink:0;background:var(--surface);border:1.5px solid var(--linea);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--txt2);cursor:pointer;transition:.12s;white-space:nowrap}
  .chip.on{background:var(--acento);border-color:var(--acento);color:#fff}
  .live{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:10px;font-weight:600;color:var(--txt2);letter-spacing:1px}
  .dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .content{padding:6px 16px 0}

  /* Sección de categoría */
  .cat-sec{margin-top:22px}
  .cat-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .cat-title .bar{width:4px;height:18px;border-radius:3px}
  .cat-title h2{font-size:14px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt)}

  /* Marca */
  .marca-block{margin-top:16px;border-left:4px solid var(--mcolor,#e63946);padding-left:11px;border-radius:3px}
  .marca-head{display:flex;align-items:center;gap:9px;padding:4px 0;margin-bottom:9px}
  .marca-chip{font-family:Roboto Mono,monospace;font-size:12px;font-weight:700;letter-spacing:2px;color:#fff;padding:5px 12px;border-radius:8px}
  .marca-count{font-size:10.5px;color:var(--txt2);font-weight:600}

  /* Grid de tarjetas */
  .grid{display:grid;grid-template-columns:1fr;gap:9px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  .card{background:var(--surface);border:1.5px solid var(--linea);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.13s;position:relative}
  .card:active{transform:scale(.985);border-color:var(--acento)}
  .card .info{flex:1;min-width:0}
  .card .nom{font-family:Roboto Mono,monospace;font-size:13px;font-weight:500;line-height:1.32;word-break:break-word}
  .cat-ico{flex-shrink:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center;opacity:.95}
  .cat-ico svg{width:24px;height:24px}
  .card.ag .cat-ico{opacity:.35}
  .cat-head-ico{display:flex;align-items:center;justify-content:center}
  .cat-head-ico svg{width:19px;height:19px}
  .card .precio{font-family:Sora;font-size:17px;font-weight:800;color:var(--acento);margin-top:5px;letter-spacing:.2px}
  .card .add{flex-shrink:0;width:38px;height:38px;border-radius:11px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:300;line-height:1}
  .card.of{border-color:var(--acento);background:#2a0f12}
  .card.of .add{background:var(--acento);color:#fff}
  .card.cm{background:#2a0f12}
  .card.ag{opacity:.5}
  .card.ag .add{display:none}
  .card.ag{cursor:default}
  .card.incart{border-color:#1d9e75;background:#0f261d}
  .card.incart .add{background:#1d9e75}
  .badges{position:absolute;top:-7px;left:12px;display:flex;gap:5px}
  .b{font-size:8px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.5px}
  .b-of{background:var(--acento);color:#fff}
  .b-cm{background:var(--rojo2);color:#fff}
  .b-cart{background:#1d9e75;color:#fff}
  .sinstock{font-family:Sora;font-size:13px;font-weight:700;color:#c0392b;margin-top:5px}

  .empty{text-align:center;padding:60px 20px;color:var(--txt2);font-size:14px}
  .foot{text-align:center;padding:24px;color:var(--txt2);font-size:11px}

  /* Carrito (igual base) */
  .cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:880px;background:#1d9e75;color:#fff;display:none;align-items:center;justify-content:space-between;padding:15px 22px;font-family:Sora;font-weight:600;cursor:pointer;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
  .cart-bar .cc{display:flex;align-items:center;gap:10px}
  .cart-bar .badge{background:#fff;color:#1d9e75;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .cart-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:880px;background:var(--surface);z-index:210;border-radius:20px 20px 0 0;transition:transform .25s;max-height:78vh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  .cart-panel.open{transform:translateX(-50%) translateY(0)}
  .cart-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;border-bottom:1px solid var(--linea)}
  .cart-head b{font-size:16px;font-weight:700}
  .cart-vaciar{background:none;border:none;color:#c0392b;font-size:12px;font-weight:600;cursor:pointer}
  .cart-items{overflow-y:auto;padding:8px 18px}
  .cart-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--linea)}
  .ci-name{flex:1;font-size:13px;font-weight:600;line-height:1.3;color:var(--txt)}
  .ci-sub{font-size:11px;color:var(--txt2);font-weight:400;margin-top:2px}
  .ci-qty{display:flex;align-items:center;gap:9px}
  .ci-qty button{width:29px;height:29px;border:1px solid var(--linea);background:var(--surface2);border-radius:8px;font-size:17px;font-weight:700;color:var(--acento);cursor:pointer}
  .ci-qty span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
  .ci-sub-total{font-family:Roboto Mono,monospace;font-weight:700;font-size:13px;min-width:72px;text-align:right;color:var(--txt)}
  .ci-del{background:none;border:none;color:#bbb;font-size:14px;cursor:pointer;padding:4px}
  .cart-foot{padding:16px 22px;border-top:1px solid var(--linea);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cart-foot-total{font-size:14px}
  .cart-foot-total strong{font-size:20px;color:var(--acento)}
  .cart-wsp{display:inline-flex;align-items:center;gap:8px;background:#1d9e75;color:#fff;border:none;border-radius:12px;padding:14px 22px;font-family:Sora;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>

<div class="wrap">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmx5IGM5lDDDDD_xrJ1Rmg8FLG3hRWjsE",
  authDomain: "clinica-celular-f6827.firebaseapp.com",
  projectId: "clinica-celular-f6827",
  storageBucket: "clinica-celular-f6827.firebasestorage.app",
  messagingSenderId: "641319344661",
  appId: "1:641319344661:web:5bb06e704088f1a3e1571e"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

var PRODUCTOS=[], filtro='', categoriaActiva='todos';
var cats=['Módulo','Batería','Placa de Carga'];
var nombres={'Módulo':'Módulos','Batería':'Baterías','Placa de Carga':'Placas de carga'};
var catColor={'Módulo':'#e63946','Batería':'#e63946','Placa de Carga':'#e63946'};
var icoColor={'Módulo':'#ffffff','Batería':'#39ff14','Placa de Carga':'#1f8fff'};
var icoGlow={'Módulo':'transparent','Batería':'rgba(57,255,20,.55)','Placa de Carga':'rgba(31,143,255,.55)'};
var catIcon={
  'Módulo':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10" y1="18.5" x2="14" y2="18.5"/></svg>',
  'Batería':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><path d="M11 9.5l-2 3h2.5l-2 2.5"/></svg>',
  'Placa de Carga':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v5M15 2v5M7 7h10v3a5 5 0 01-10 0V7zM12 15v7"/></svg>'
};
var ORDEN_FIJO={'samsung':1,'motorola':2,'iphone':3,'apple':3,'xiaomi':4,'tcl':5,'lg':6};
var MARCA_COLOR={'samsung':'#2d5bd9','motorola':'#16b378','iphone':'#c7ccd4','apple':'#c7ccd4','xiaomi':'#ff7a1a','tcl':'#f0463f','lg':'#d44b78','huawei':'#e8434f','nokia':'#3b7dd8','realme':'#ffd633','oppo':'#2ec46f','honor':'#22b0ec'};
function getOrdenMarca(marca,productos){
  var m=marca.toLowerCase().trim();
  for(var key in ORDEN_FIJO){ if(m.indexOf(key)>=0) return ORDEN_FIJO[key]; }
  var ov=productos.map(function(p){return p.orden||0;}).filter(function(o){return o>0;});
  if(ov.length>0) return 100+Math.min.apply(null,ov);
  return 9999;
}
function colorMarca(marca){ var m=marca.toLowerCase().trim(); for(var k in MARCA_COLOR){ if(m.indexOf(k)>=0) return MARCA_COLOR[k]; } return '#e63946'; }
function tintMarca(hex){
  hex=hex.replace('#',''); if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+',0.18)';
}
function txtChip(hex){
  hex=hex.replace('#',''); if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  var lum=(0.299*r+0.587*g+0.114*b);
  return lum>150?'#1a1a1a':'#fff';
}
function fmt(n){ return '$ '+Number(n||0).toLocaleString('es-AR'); }

var CART={}, WSP_NUMERO='5491127999050';
function cartId(p){ return (p.categoria||'')+'|'+(p.modelo||'')+'|'+(p.nombre||''); }
function addToCart(id){
  var p=PRODUCTOS.find(function(x){return cartId(x)===id;});
  if(!p||p.stock===0) return;
  if(CART[id]) CART[id].cant++; else CART[id]={nombre:p.nombre,precio:p.precio,cant:1};
  renderCarrito(); render();
}
window.cambiarCant=function(id,d){ if(!CART[id])return; CART[id].cant+=d; if(CART[id].cant<=0)delete CART[id]; renderCarrito(); render(); };
window.quitarItem=function(id){ delete CART[id]; renderCarrito(); render(); };
window.vaciarCarrito=function(){ CART={}; renderCarrito(); render(); };
function totalCarrito(){ var t=0,n=0; for(var id in CART){ t+=CART[id].precio*CART[id].cant; n+=CART[id].cant; } return {total:t,unidades:n}; }
function renderCarrito(){
  var bar=document.getElementById('cart-bar'), panel=document.getElementById('cart-panel'), t=totalCarrito();
  if(t.unidades===0){ bar.style.display='none'; panel.classList.remove('open'); return; }
  bar.style.display='flex';
  document.getElementById('cart-count').textContent=t.unidades;
  document.getElementById('cart-total').textContent=fmt(t.total);
  var items='';
  for(var id in CART){ var it=CART[id]; var sid=id.replace(/'/g,"\\'");
    items+='<div class="cart-item"><div class="ci-name">'+it.nombre+'<div class="ci-sub">'+fmt(it.precio)+' c/u</div></div>'+
    '<div class="ci-qty"><button onclick="cambiarCant(\''+sid+'\',-1)">−</button><span>'+it.cant+'</span><button onclick="cambiarCant(\''+sid+'\',1)">+</button></div>'+
    '<div class="ci-sub-total">'+fmt(it.precio*it.cant)+'</div><button class="ci-del" onclick="quitarItem(\''+sid+'\')">✕</button></div>';
  }
  document.getElementById('cart-items').innerHTML=items;
  document.getElementById('panel-total').textContent=fmt(t.total);
}
window.toggleCarrito=function(){ document.getElementById('cart-panel').classList.toggle('open'); };
window.enviarWhatsApp=function(){
  var t=totalCarrito(); if(t.unidades===0) return;
  var msg='*PEDIDO - La Clínica del Celular*\n\n';
  for(var id in CART){ var it=CART[id]; msg+='• '+it.cant+'x '+it.nombre+' — '+fmt(it.precio*it.cant)+'\n'; }
  msg+='\n*Total: '+fmt(t.total)+'* ('+t.unidades+' u.)\n\nHola! Quiero hacer este pedido.';
  window.open('https://wa.me/'+WSP_NUMERO+'?text='+encodeURIComponent(msg),'_blank');
};

function render(){
  var cont=document.getElementById('content'), f=filtro.toLowerCase().trim();
  var html='', hayAlgo=false;
  cats.forEach(function(cat){
    if(categoriaActiva!=='todos' && cat!==categoriaActiva) return;
    var prodsCat=PRODUCTOS.filter(function(p){
      if(p.categoria!==cat) return false;
      if(!f) return true;
      return (p.nombre||'').toLowerCase().indexOf(f)>=0 || (p.modelo||'').toLowerCase().indexOf(f)>=0;
    });
    if(prodsCat.length===0) return;
    hayAlgo=true;
    var grupos={};
    prodsCat.forEach(function(p){ var m=(p.modelo||'Sin marca').trim(); if(!grupos[m])grupos[m]=[]; grupos[m].push(p); });
    var marcas=Object.keys(grupos).sort(function(a,b){
      var oa=getOrdenMarca(a,grupos[a]), ob=getOrdenMarca(b,grupos[b]);
      if(oa!==ob) return oa-ob; return a.localeCompare(b,'es');
    });
    html+='<div class="cat-sec"><div class="cat-title"><div class="bar" style="background:'+(icoColor[cat]||'#e63946')+'"></div><div class="cat-head-ico" style="color:'+(icoColor[cat]||'#e63946')+';filter:drop-shadow(0 0 4px '+(icoGlow[cat]||'transparent')+')">'+(catIcon[cat]||'')+'</div><h2>'+nombres[cat]+'</h2></div>';
    marcas.forEach(function(marca){
      grupos[marca].sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');});
      var mcol=colorMarca(marca);
      html+='<div class="marca-block" style="--mcolor:'+mcol+'"><div class="marca-head"><span class="marca-chip" style="background:'+mcol+';color:'+txtChip(mcol)+'">'+marca.toUpperCase()+'</span></div><div class="grid">';
      grupos[marca].forEach(function(p){
        var ag=p.stock===0, of=!!p.oferta&&!ag, cm=!!p.marco&&!ag;
        var id=cartId(p), inc=CART[id];
        var cls='card'+(ag?' ag':'')+(of?' of':'')+(cm?' cm':'')+(inc?' incart':'');
        var badges='';
        if(of||cm||inc){ badges='<div class="badges">';
          if(of) badges+='<span class="b b-of">OFERTA</span>';
          if(cm) badges+='<span class="b b-cm">C/MARCO</span>';
          if(inc) badges+='<span class="b b-cart">'+inc.cant+' EN PEDIDO</span>';
          badges+='</div>'; }
        var precio=ag?'<div class="sinstock">SIN STOCK</div>':'<div class="precio">'+fmt(p.precio)+'</div>';
        var addBtn=ag?'':'<div class="add">+</div>';
        var ico='<div class="cat-ico" style="color:'+(icoColor[cat]||'#e63946')+';filter:drop-shadow(0 0 5px '+(icoGlow[cat]||'transparent')+')">'+(catIcon[cat]||'')+'</div>';
        html+='<div class="'+cls+'"'+(ag?'':' data-pid="'+id+'"')+'>'+badges+ico+'<div class="info"><div class="nom">'+(p.nombre||'')+'</div>'+precio+'</div>'+addBtn+'</div>';
      });
      html+='</div></div>';
    });
    html+='</div>';
  });
  if(!hayAlgo) html='<div class="empty">'+(f?'No se encontraron productos con "'+filtro+'"':'No hay productos en esta categoría')+'</div>';
  cont.innerHTML=html;
}
document.getElementById('search').addEventListener('input',function(e){ filtro=e.target.value; render(); });
document.getElementById('content').addEventListener('click',function(e){
  var card=e.target.closest('.card[data-pid]');
  if(card && card.dataset.pid) addToCart(card.dataset.pid);
});
window.setCategoria=function(cat,btn){
  categoriaActiva=cat;
  document.querySelectorAll('.chip').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  render();
};
onSnapshot(doc(db,'clinica','datos'),function(snap){
  document.getElementById('loading').style.display='none';
  if(snap.exists()){ var d=snap.data(); PRODUCTOS=(d.productos||[]).filter(function(p){return cats.indexOf(p.categoria)>=0;}); }
  else PRODUCTOS=[];
  render();
},function(err){
  document.getElementById('loading').style.display='none';
  document.getElementById('content').innerHTML='<div class="empty">Error: '+err.message+'</div>';
});
</script>
</body>
</html>

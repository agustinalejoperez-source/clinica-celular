<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo en vivo · La Clínica del Celular</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo en vivo - La Clínica del Celular">
<meta property="og:description" content="Lista de precios actualizada en tiempo real. Módulos, baterías y placas de carga. Ituzaingó 469 · 11 2799-9050">
<meta property="og:image" content="https://agustinalejoperez-source.github.io/clinica-celular/logo.png">
<meta property="og:url" content="https://agustinalejoperez-source.github.io/clinica-celular/catalogo.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catálogo en vivo - La Clínica del Celular">
<meta name="twitter:description" content="Lista de precios actualizada en tiempo real. Módulos, baterías y placas de carga.">
<meta name="twitter:image" content="https://agustinalejoperez-source.github.io/clinica-celular/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;font-family:Georgia,serif;color:#000;padding-bottom:40px}
  .loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999}
  .spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#ffe600;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{max-width:780px;margin:0 auto;background:#fff;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:50;background:#000;padding:12px 16px}
  .search{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:11px 16px;color:#fff;font-family:Roboto Mono,monospace;font-size:14px;outline:none}
  .search:focus{border-color:#ffe600}
  .live-badge{display:inline-flex;align-items:center;gap:6px;background:#1a5e1a;color:#7fff7f;font-family:Arial,sans-serif;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:1px;margin-top:8px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#7fff7f;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .header{background:#000;padding:28px 20px 16px;text-align:center}
  .header img{max-width:300px;width:75%;height:auto}
  .header .sub{margin-top:14px;font-family:Georgia,serif;font-size:11px;color:#aaa;letter-spacing:5px;font-style:italic}
  .contact{background:#000;padding:12px 20px;text-align:center;color:#ddd;font-family:Arial,sans-serif;font-size:12px;border-bottom:4px solid #ffe600}
  .content{padding:0 14px}
  .empty{text-align:center;padding:50px 20px;color:#888;font-family:Arial,sans-serif}
  .cat-menu{display:flex;gap:8px;padding:12px 14px 4px;flex-wrap:wrap;justify-content:center}
  .cat-btn{flex:1;min-width:90px;background:#1a1a1a;border:2px solid #333;border-radius:10px;padding:12px 8px;color:#ccc;font-family:Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.15s;text-align:center}
  .cat-btn:hover{border-color:#666}
  .cat-btn.active-mod{background:#7cb342;border-color:#7cb342;color:#000}
  .cat-btn.active-bat{background:#e63946;border-color:#e63946;color:#fff}
  .cat-btn.active-pla{background:#2c2c2c;border-color:#888;color:#fff}
  .cat-btn.active-todos{background:#ffe600;border-color:#ffe600;color:#000}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="color:#ffe600;font-family:Arial,sans-serif;font-size:13px;letter-spacing:2px">CARGANDO CATALOGO...</div>
</div>

<div class="wrap">
  <div class="header">
    <img src="logo.png" alt="La Clinica del Celular" onerror="this.style.display='none'">
    <div class="sub">— LISTA DE PRECIOS EN VIVO —</div>
  </div>
  <div class="contact">
    Ituzaingo 469 &nbsp;&nbsp;&nbsp; 11 2799-9050
  </div>
  <div class="topbar">
    <input type="text" class="search" id="search" placeholder="🔍 Buscar producto, marca o modelo...">
    <div style="text-align:center"><span class="live-badge"><span class="live-dot"></span>ACTUALIZADO EN TIEMPO REAL</span></div>
  </div>
  <div class="cat-menu" id="cat-menu">
    <div class="cat-btn active-todos" data-cat="todos" onclick="setCategoria('todos',this)">TODOS</div>
    <div class="cat-btn" data-cat="Módulo" onclick="setCategoria('Módulo',this)">MÓDULOS</div>
    <div class="cat-btn" data-cat="Batería" onclick="setCategoria('Batería',this)">BATERÍAS</div>
    <div class="cat-btn" data-cat="Placa de Carga" onclick="setCategoria('Placa de Carga',this)">PLACAS DE CARGA</div>
  </div>
  <div class="content" id="content"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmx5IGM5lDDDDD_xrJ1Rmg8FLG3hRWjsE",
  authDomain: "clinica-celular-f6827.firebaseapp.com",
  projectId: "clinica-celular-f6827",
  storageBucket: "clinica-celular-f6827.firebasestorage.app",
  messagingSenderId: "641319344661",
  appId: "1:641319344661:web:5bb06e704088f1a3e1571e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

var PRODUCTOS = [];
var filtro = '';
var categoriaActiva = 'todos';

var cats=['Módulo','Batería','Placa de Carga'];
var nombres={'Módulo':'MODULOS','Batería':'BATERIAS','Placa de Carga':'PLACAS DE CARGA'};
var catColor={'Módulo':'#7cb342','Batería':'#e63946','Placa de Carga':'#2c2c2c'};
var headerTextColor={'Módulo':'#000','Batería':'#000','Placa de Carga':'#fff'};
var ORDEN_FIJO={'samsung':1,'motorola':2,'iphone':3,'apple':3,'xiaomi':4,'tcl':5,'lg':6};

function getOrdenMarca(marca, productos){
  var m=marca.toLowerCase().trim();
  for(var key in ORDEN_FIJO){ if(m.indexOf(key)>=0) return ORDEN_FIJO[key]; }
  var ordenesValidos=productos.map(function(p){return p.orden||0;}).filter(function(o){return o>0;});
  if(ordenesValidos.length>0) return 100+Math.min.apply(null,ordenesValidos);
  return 9999;
}
function espaciar(txt){ return txt.toUpperCase().split('').join(' '); }
function fmt(n){ return '$ '+Number(n||0).toLocaleString('es-AR'); }

function filaProducto(p, esUltima){
  var ag=p.stock===0;
  var oferta=!!p.oferta && !ag;
  var marco=!!p.marco && !ag;
  var precioStr=ag?'SIN STOCK':fmt(p.precio);
  var bb=esUltima?'':'border-bottom:1px solid #e8e8e8;';
  var nombre=p.nombre||'';
  var unaCol = window.innerWidth < 600;
  var fs, nameCell;
  if(unaCol){
    fs=14;
    if(nombre.length>34) fs=12.5;
    nameCell='padding:9px 10px;'+bb+'font-family:Roboto Mono,monospace;font-size:'+fs+'px;line-height:1.25;word-break:break-word';
  } else {
    fs=11;
    if(nombre.length>18) fs=10;
    if(nombre.length>24) fs=9;
    if(nombre.length>30) fs=8;
    if(nombre.length>38) fs=7;
    if(nombre.length>46) fs=6.5;
    nameCell='padding:8px 10px;'+bb+'font-family:Roboto Mono,monospace;font-size:'+fs+'px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  }
  var mid='';
  if(oferta){
    mid='<span style="display:inline-block;background:#000;color:#ffe600;font-family:Arial;font-size:7px;font-weight:900;padding:2px 5px;border-radius:2px">OFERTA</span>';
    if(marco) mid+='<br><span style="display:inline-block;background:#9a4d00;color:#fff;font-family:Arial;font-size:7px;font-weight:900;padding:2px 5px;border-radius:2px;margin-top:2px">C/M</span>';
  } else if(marco){
    mid='<span style="display:inline-block;background:#9a4d00;color:#fff;font-family:Arial;font-size:7px;font-weight:900;padding:2px 5px;border-radius:2px">C/M</span>';
  }
  var bg='#fff';
  if(oferta) bg='#ffe600';
  else if(marco) bg='#ffd4a3';
  else if(!ag && p.color) bg=p.color;
  var colorP=ag?'#c00':'#000';
  var colorN=ag?'#888':'#000';
  return '<tr style="background:'+bg+'">'+
    '<td style="'+nameCell+';color:'+colorN+';font-weight:'+(oferta?'600':'500')+'">'+(oferta?'(OF) ':'')+nombre+'</td>'+
    '<td style="padding:8px 4px;'+bb+'text-align:center;width:48px">'+mid+'</td>'+
    '<td style="padding:8px 10px;'+bb+'font-family:Roboto Mono,monospace;font-size:11px;color:'+colorP+';font-weight:700;text-align:right;white-space:nowrap;width:85px">'+precioStr+'</td>'+
  '</tr>';
}

function tablaProductos(prods){
  var unaColumna = window.innerWidth < 600;
  function col(ps){
    if(ps.length===0) return '<table style="width:100%;border-collapse:collapse;table-layout:fixed"></table>';
    return '<table style="width:100%;border-collapse:collapse;table-layout:fixed">'+
      '<colgroup><col style="width:auto"><col style="width:48px"><col style="width:85px"></colgroup>'+
      '<thead><tr style="background:#f5f5f5">'+
        '<th style="padding:5px 10px;font-family:Arial;font-size:8px;color:#666;text-align:left;border-bottom:1px solid #ccc">PRODUCTO</th>'+
        '<th style="border-bottom:1px solid #ccc"></th>'+
        '<th style="padding:5px 10px;font-family:Arial;font-size:8px;color:#666;text-align:right;border-bottom:1px solid #ccc">PRECIO</th>'+
      '</tr></thead><tbody>'+
      ps.map(function(p,i){return filaProducto(p,i===ps.length-1);}).join('')+
      '</tbody></table>';
  }
  if(unaColumna){
    return col(prods);
  }
  var mid=Math.ceil(prods.length/2);
  var c1=prods.slice(0,mid), c2=prods.slice(mid);
  return '<table style="width:100%;border-collapse:collapse"><tr>'+
    '<td style="vertical-align:top;width:50%;border-right:1px solid #000">'+col(c1)+'</td>'+
    '<td style="vertical-align:top;width:50%">'+col(c2)+'</td>'+
  '</tr></table>';
}

function render(){
  var cont=document.getElementById('content');
  var f=filtro.toLowerCase().trim();
  var html='';
  var hayAlgo=false;

  cats.forEach(function(cat){
    if(categoriaActiva!=='todos' && cat!==categoriaActiva) return;
    var prodsCat=PRODUCTOS.filter(function(p){
      if(p.categoria!==cat) return false;
      if(!f) return true;
      return (p.nombre||'').toLowerCase().indexOf(f)>=0 || (p.modelo||'').toLowerCase().indexOf(f)>=0;
    });
    if(prodsCat.length===0) return;
    hayAlgo=true;

    var grupos={};
    prodsCat.forEach(function(p){ var m=(p.modelo||'Sin marca').trim(); if(!grupos[m])grupos[m]=[]; grupos[m].push(p); });
    var marcas=Object.keys(grupos).sort(function(a,b){
      var oa=getOrdenMarca(a,grupos[a]), ob=getOrdenMarca(b,grupos[b]);
      if(oa!==ob) return oa-ob;
      return a.localeCompare(b,'es');
    });
    marcas.forEach(function(m){ grupos[m].sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');}); });

    var color=catColor[cat], ht=headerTextColor[cat];
    html+='<div style="margin-top:18px;border:1px solid #000;background:#fff">';
    html+='<div style="background:'+color+';padding:13px 18px;text-align:center;border-bottom:1px solid #000"><div style="font-family:Georgia,serif;color:'+ht+';font-size:15px;font-weight:900;letter-spacing:4px">LISTA DE '+nombres[cat]+'</div></div>';
    marcas.forEach(function(marca,idx){
      html+='<div style="background:'+color+';padding:9px 18px;text-align:center'+(idx>0?';border-top:1px solid #000':'')+'"><div style="font-family:Georgia,serif;color:'+ht+';font-size:13px;font-weight:900;letter-spacing:5px">'+espaciar(marca)+'</div></div>';
      html+='<div style="border-top:1px solid #000">'+tablaProductos(grupos[marca])+'</div>';
    });
    html+='</div>';
  });

  if(!hayAlgo){
    html='<div class="empty">'+(f?'No se encontraron productos con "'+filtro+'"':'No hay productos en esta categoría')+'</div>';
  }

  if(hayAlgo){
    html+='<div style="background:#000;padding:16px;text-align:center;border-top:4px solid #ffe600;margin-top:24px">'+
      '<div style="font-family:Georgia,serif;font-size:10px;color:#ffe600;letter-spacing:2px;font-style:italic">— Gracias por su preferencia —</div>'+
    '</div>';
  }

  cont.innerHTML=html;
}

document.getElementById('search').addEventListener('input', function(e){
  filtro=e.target.value;
  render();
});

window.setCategoria = function(cat, btn){
  categoriaActiva = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b){
    b.classList.remove('active-todos','active-mod','active-bat','active-pla');
  });
  if(cat==='todos') btn.classList.add('active-todos');
  else if(cat==='Módulo') btn.classList.add('active-mod');
  else if(cat==='Batería') btn.classList.add('active-bat');
  else if(cat==='Placa de Carga') btn.classList.add('active-pla');
  render();
};

window.addEventListener('resize', render);

onSnapshot(doc(db,'clinica','datos'), function(snap){
  document.getElementById('loading').style.display='none';
  if(snap.exists()){
    var data=snap.data();
    PRODUCTOS=(data.productos||[]).filter(function(p){
      return cats.indexOf(p.categoria)>=0;
    });
  } else {
    PRODUCTOS=[];
  }
  render();
}, function(err){
  document.getElementById('loading').style.display='none';
  document.getElementById('content').innerHTML='<div class="empty">Error: '+err.message+'</div>';
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gestión · La Clínica del Celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85,500;85,600;85,700;85,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F5F6F8; --superficie:#FFFFFF; --tinta:#1B2733; --tinta2:#5B6B7A;
  --borde:#E3E7EC; --verde:#0E6E5C; --verde-suave:#E4F1EE; --rojo:#B3372E; --rojo-suave:#F9E9E7;
  --ambar:#B7791F; --ambar-suave:#F8F0DF; --azul:#2B6CB0; --azul-suave:#E6EEF7;
  --gris-chip:#EEF1F4; --wa:#1FAF54; --radio:14px;
  --sombra:0 1px 2px rgba(27,39,51,.06), 0 4px 14px rgba(27,39,51,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh;padding-bottom:110px}
h1,h2,h3,.num,.display{font-family:'Archivo',sans-serif;font-stretch:85%}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;border:none;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:1rem;width:100%;padding:12px 14px;border:1.5px solid var(--borde);border-radius:10px;background:#FBFCFD;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);background:#fff}
label{display:block;font-size:.8rem;font-weight:600;color:var(--tinta2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

/* ---------- LOGIN ---------- */
#loginScreen{position:fixed;inset:0;background:var(--fondo);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--superficie);border-radius:18px;box-shadow:var(--sombra);padding:32px 26px;width:100%;max-width:400px;border-top:5px solid var(--verde)}
.login-card h1{font-size:1.35rem;font-weight:800;letter-spacing:.01em}
.login-card .sub{color:var(--tinta2);font-size:.85rem;margin-top:4px}
.login-err{display:none;background:var(--rojo-suave);color:var(--rojo);padding:10px 12px;border-radius:10px;font-size:.85rem;margin-top:14px;font-weight:500}

/* ---------- HEADER + TABS ---------- */
header{background:var(--superficie);border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:50}
.head-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.brand{font-family:'Archivo';font-stretch:85%;font-weight:800;font-size:1.02rem;letter-spacing:.02em}
.brand small{display:block;font-weight:600;font-size:.68rem;color:var(--verde);letter-spacing:.14em;text-transform:uppercase}
#btnSalir{font-size:.78rem;font-weight:600;color:var(--tinta2);padding:8px 12px;border:1.5px solid var(--borde);border-radius:99px}
.tabs{display:flex;gap:6px;padding:0 12px}
.tab{flex:1;padding:11px 4px;font-family:'Archivo';font-stretch:85%;font-weight:700;font-size:.95rem;color:var(--tinta2);border-bottom:3px solid transparent;letter-spacing:.02em}
.tab.activa{color:var(--verde);border-color:var(--verde)}

main{max-width:640px;margin:0 auto;padding:16px 14px}
.seccion{display:none}.seccion.activa{display:block}

/* ---------- PLANILLA DE CAJA (elemento firma) ---------- */
.planilla{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra);border-top:6px solid var(--verde);padding:18px 18px 14px;position:relative}
.planilla .rotulo{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta2)}
.caja-monto{font-family:'Archivo';font-stretch:85%;font-weight:800;font-size:2.35rem;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.caja-grid{display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--borde)}
.caja-grid > div{flex:1}
.mini-rotulo{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.mini-monto{font-family:'Archivo';font-stretch:85%;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;margin-top:2px}
.verde-t{color:var(--verde)} .rojo-t{color:var(--rojo)} .ambar-t{color:var(--ambar)}
.caja-botones{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px 8px;border-radius:11px;font-weight:700;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-verde{background:var(--verde);color:#fff}
.btn-blanco{background:var(--superficie);color:var(--tinta);border:1.5px solid var(--borde)}
.btn-rojo-s{background:var(--rojo-suave);color:var(--rojo)}
.btn-verde-s{background:var(--verde-suave);color:var(--verde)}

/* renglones estilo libreta con puntos guía */
.renglon{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid #F0F2F5;font-size:.88rem}
.renglon .concepto{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.renglon .guia{flex:1;border-bottom:2px dotted #D5DBE1;transform:translateY(-4px)}
.renglon .monto{font-family:'Archivo';font-stretch:85%;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.renglon .fecha-r{display:block;font-size:.7rem;color:var(--tinta2);font-weight:500}

.plegable{margin-top:6px}
.plegable summary{list-style:none;cursor:pointer;padding:10px 0 2px;font-size:.8rem;font-weight:700;color:var(--verde);display:flex;align-items:center;gap:4px}
.plegable summary::-webkit-details-marker{display:none}
.plegable summary::after{content:'▾';transition:transform .15s}
.plegable[open] summary::after{transform:rotate(180deg)}

/* ---------- SEGMENTED ---------- */
.segmentos{display:flex;background:var(--gris-chip);border-radius:11px;padding:4px;margin:18px 0 12px;gap:4px}
.seg{flex:1;padding:9px 4px;border-radius:8px;font-size:.8rem;font-weight:700;color:var(--tinta2)}
.seg.activa{background:var(--superficie);color:var(--tinta);box-shadow:0 1px 3px rgba(27,39,51,.12)}

/* ---------- TARJETAS ---------- */
.tarjeta{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.t-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t-titulo{font-family:'Archivo';font-stretch:85%;font-weight:700;font-size:1.05rem}
.t-sub{font-size:.78rem;color:var(--tinta2);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase}
.chip-verde{background:var(--verde-suave);color:var(--verde)}
.chip-ambar{background:var(--ambar-suave);color:var(--ambar)}
.chip-gris{background:var(--gris-chip);color:var(--tinta2)}
.chip-rojo{background:var(--rojo-suave);color:var(--rojo)}
.chip-azul{background:var(--azul-suave);color:var(--azul)}
.datos-fila{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dato{flex:1;min-width:88px;background:#F8F9FB;border-radius:10px;padding:8px 10px}
.dato .mini-rotulo{font-size:.6rem}
.dato .mini-monto{font-size:.98rem}
.t-acciones{display:flex;gap:8px;margin-top:14px}
.t-acciones .btn{padding:10px 6px;font-size:.8rem}
.btn-menu{flex:0 0 44px;border:1.5px solid var(--borde);border-radius:11px;font-size:1.2rem;color:var(--tinta2);font-weight:700}
.vacio{text-align:center;color:var(--tinta2);padding:40px 20px;font-size:.9rem}
.vacio strong{display:block;font-family:'Archivo';font-stretch:85%;font-size:1.05rem;color:var(--tinta);margin-bottom:4px}

/* resumen gremio */
.chips-resumen{display:flex;gap:8px;margin-bottom:4px}
.chip-res{flex:1;background:var(--superficie);border-radius:12px;box-shadow:var(--sombra);padding:12px 10px;text-align:center}
.filtros{display:flex;gap:8px;margin:14px 0 12px}
.filtros select{padding:10px 12px;font-size:.85rem;border-radius:10px}

/* ---------- FAB ---------- */
.fab{position:fixed;bottom:22px;right:18px;left:18px;max-width:612px;margin:0 auto;background:var(--tinta);color:#fff;padding:16px;border-radius:14px;font-family:'Archivo';font-stretch:85%;font-weight:700;font-size:1rem;letter-spacing:.03em;box-shadow:0 6px 20px rgba(27,39,51,.3);display:none;z-index:40}
.fab.visible{display:block}
.fab:active{transform:scale(.98)}

/* ---------- SHEET (modal) ---------- */
#velo{position:fixed;inset:0;background:rgba(27,39,51,.45);z-index:90;display:none;opacity:0;transition:opacity .2s}
#velo.abierto{display:block;opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-radius:20px 20px 0 0;z-index:100;transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.9,.4,1);max-height:88vh;overflow-y:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#sheet.abierto{transform:translateY(0)}
.sheet-asa{width:42px;height:5px;background:var(--borde);border-radius:99px;margin:6px auto 14px}
.sheet-titulo{font-family:'Archivo';font-stretch:85%;font-weight:800;font-size:1.25rem}
.sheet-sub{font-size:.83rem;color:var(--tinta2);margin-top:3px}
.fila-2{display:flex;gap:10px}.fila-2>div{flex:1}
.gan-preview{margin-top:16px;background:var(--verde-suave);border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;color:var(--verde)}
.gan-preview .num{font-size:1.1rem}
.sheet-botones{display:flex;gap:10px;margin-top:22px}
.sheet-botones .btn{padding:14px}
.aviso{margin-top:14px;background:var(--ambar-suave);color:var(--ambar);border-radius:10px;padding:10px 12px;font-size:.8rem;font-weight:500;display:none}

/* ---------- TOAST / BANNER ---------- */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:12px 20px;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;transition:all .25s;z-index:150;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
#bannerError{display:none;background:var(--rojo-suave);color:var(--rojo);padding:14px 16px;border-radius:12px;font-size:.85rem;font-weight:500;margin-bottom:14px;line-height:1.5}
.total-mes{background:var(--tinta);color:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.total-mes .rotulo{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.total-mes .num{font-family:'Archivo';font-stretch:85%;font-weight:800;font-size:1.3rem}
.btn-wa{background:var(--wa);color:#fff}
.lista-gastos{margin-top:10px;background:#F8F9FB;border-radius:10px;padding:4px 12px}
.lista-gastos .renglon{border-color:#E9ECF0;font-size:.82rem}
.lista-gastos .renglon:last-child{border-bottom:none}
.debe-badge{background:var(--rojo);color:#fff;font-size:.68rem;font-weight:800;padding:4px 9px;border-radius:99px;letter-spacing:.05em}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>LA CLÍNICA DEL CELULAR</h1>
    <div class="sub">Gestión de caja y reparaciones. Entrá con el mismo usuario del inventario.</div>
    <label for="logEmail">Email</label>
    <input type="email" id="logEmail" autocomplete="username" placeholder="tu@email.com">
    <label for="logPass">Contraseña</label>
    <input type="password" id="logPass" autocomplete="current-password" placeholder="••••••••">
    <div class="login-err" id="logErr"></div>
    <div class="sheet-botones"><button class="btn btn-verde" id="btnEntrar" style="flex:1">Entrar</button></div>
  </div>
</div>

<!-- ============ APP ============ -->
<header>
  <div class="head-row">
    <div class="brand">GESTIÓN<small>La Clínica del Celular</small></div>
    <button id="btnSalir">Salir</button>
  </div>
  <nav class="tabs">
    <button class="tab activa" data-tab="cv">Compra · Venta</button>
    <button class="tab" data-tab="gremio">Gremio</button>
  </nav>
</header>

<main>
  <div id="bannerError"></div>

  <!-- ===== COMPRA VENTA ===== -->
  <section class="seccion activa" id="sec-cv">
    <div class="planilla">
      <div class="rotulo">Caja compra · venta</div>
      <div class="caja-monto num" id="cajaMonto">$ 0</div>
      <div class="caja-grid">
        <div><div class="mini-rotulo">Ganancia acumulada</div><div class="mini-monto verde-t num" id="ganMonto">$ 0</div></div>
        <div><div class="mini-rotulo">Invertido en stock</div><div class="mini-monto num" id="invMonto">$ 0</div></div>
      </div>
      <div class="caja-botones">
        <button class="btn btn-verde-s" onclick="abrirMovimiento('ingreso')">+ Agregar plata</button>
        <button class="btn btn-rojo-s" onclick="abrirMovimiento('egreso')">− Retirar plata</button>
      </div>
      <details class="plegable"><summary>Movimientos de caja</summary><div id="listaMovs"></div></details>
    </div>

    <div class="segmentos" id="segCV">
      <button class="seg activa" data-vista="stock">En stock</button>
      <button class="seg" data-vista="desarme">Desarme</button>
      <button class="seg" data-vista="vendidos">Vendidos</button>
    </div>
    <div id="listaCV"></div>
  </section>

  <!-- ===== GREMIO ===== -->
  <section class="seccion" id="sec-gremio">
    <div class="chips-resumen">
      <div class="chip-res"><div class="mini-rotulo">En taller</div><div class="mini-monto num" id="gTaller">0</div></div>
      <div class="chip-res"><div class="mini-rotulo">Ganancia del mes</div><div class="mini-monto verde-t num" id="gGanMes">$ 0</div></div>
      <div class="chip-res"><div class="mini-rotulo">Por cobrar</div><div class="mini-monto rojo-t num" id="gDebe">$ 0</div></div>
    </div>
    <div class="filtros">
      <select id="filtroEstado" onchange="render()">
        <option value="taller">En taller</option>
        <option value="observacion">En observación</option>
        <option value="listo">Listos</option>
        <option value="retirado">Retirados</option>
        <option value="sinarreglo">Sin arreglo</option>
        <option value="todos">Todos</option>
      </select>
      <select id="filtroCliente" onchange="render()"><option value="">Todos los clientes</option></select>
    </div>
    <div id="resumenCliente"></div>
    <div id="listaGremio"></div>
  </section>
</main>

<button class="fab visible" id="fab" onclick="fabClick()">+ Cargar teléfono</button>

<div id="velo" onclick="cerrarSheet()"></div>
<div id="sheet"><div class="sheet-asa"></div><div id="sheetContenido"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmx5IGM5lDDDDD_xrJ1Rmg8FLG3hRWjsE",
  authDomain: "clinica-celular-f6827.firebaseapp.com",
  projectId: "clinica-celular-f6827",
  storageBucket: "clinica-celular-f6827.firebasestorage.app",
  messagingSenderId: "641319344661",
  appId: "1:641319344661:web:5bb06e704088f1a3e1571e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
try{ enableIndexedDbPersistence(db).catch(function(){}); }catch(e){}

const DOC_REF = doc(db,'gestion','datos');

// ================= ESTADO =================
let DB = null;
let vistaCV = 'stock';
let guardando = false;

function baseDB(){
  return {
    caja: 0,
    ganancia: 0,
    movimientos: [],   // {id, fecha, detalle, monto, tipo:'ingreso'|'egreso'}
    telefonos: [],     // ver estructura en cada función
    gremio: { proxOrden: 1, clientes: [], ordenes: [] }
  };
}

// ================= UTILIDADES =================
const $ = function(id){ return document.getElementById(id); };
function fmt(n){ return '$ ' + Math.round(n||0).toLocaleString('es-AR'); }
function hoyISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fFecha(iso){ if(!iso) return ''; const p=iso.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function nid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ const n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; }
function mesDe(iso){ return iso ? iso.slice(0,7) : ''; }
function nomMes(m){ const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; const p=m.split('-'); return M[parseInt(p[1])-1]+' '+p[0]; }
function inversion(t){ return (t.precioCompra||0) + (t.gastos||[]).reduce(function(a,g){return a+(g.monto||0);},0); }
function waLink(numero, msj){
  let n = String(numero||'').replace(/\D/g,'');
  if(n.length===10) n = '549'+n;
  else if(n.startsWith('15')) n = '54911'+n.slice(2);
  else if(!n.startsWith('54')) n = '549'+n;
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(msj);
}
let toastT;
function toast(msj){ const t=$('toast'); t.textContent=msj; t.classList.add('visible'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('visible');},2600); }

// ================= GUARDADO =================
async function guardar(){
  if(!DB) return;
  try{
    guardando = true;
    await setDoc(DOC_REF, DB);
  }catch(e){
    console.error(e);
    if(String(e.code).includes('permission')) mostrarErrorPermisos();
    else toast('No se pudo guardar. Revisá tu conexión.');
  }
  guardando = false;
}
function mostrarErrorPermisos(){
  const b=$('bannerError');
  b.style.display='block';
  b.innerHTML='<strong>Falta un paso en Firebase.</strong><br>Los permisos todavía no dejan guardar los datos de gestión. Escribile a Claude "no me deja guardar la gestión" y te paso el paso a paso para habilitarlo (se hace una sola vez, 2 minutos).';
}

// ================= AUTH =================
$('btnEntrar').addEventListener('click', entrar);
$('logPass').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
async function entrar(){
  const err=$('logErr'); err.style.display='none';
  try{
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth, $('logEmail').value.trim(), $('logPass').value);
  }catch(e){
    err.style.display='block';
    err.textContent = 'No se pudo entrar. Revisá el email y la contraseña (son los mismos del inventario).';
  }
}
$('btnSalir').addEventListener('click', function(){ if(confirm('¿Cerrar sesión?')) signOut(auth); });

let escuchando = false;
onAuthStateChanged(auth, function(user){
  if(user){
    $('loginScreen').style.display='none';
    if(!escuchando){
      escuchando = true;
      onSnapshot(DOC_REF, function(snap){
        if(snap.exists()){ DB = snap.data(); }
        else { DB = baseDB(); guardar(); }
        normalizar();
        render();
      }, function(e){
        console.error(e);
        if(String(e.code).includes('permission')){ DB = DB || baseDB(); mostrarErrorPermisos(); render(); }
      });
    }
  } else {
    $('loginScreen').style.display='flex';
  }
});
function normalizar(){
  if(!DB.movimientos) DB.movimientos=[];
  if(!DB.telefonos) DB.telefonos=[];
  if(!DB.gremio) DB.gremio={proxOrden:1,clientes:[],ordenes:[]};
  if(!DB.gremio.clientes) DB.gremio.clientes=[];
  if(!DB.gremio.ordenes) DB.gremio.ordenes=[];
  if(!DB.gremio.proxOrden) DB.gremio.proxOrden=1;
}

// ================= TABS =================
let tabActiva='cv';
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    tabActiva = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('activa', x===t);});
    $('sec-cv').classList.toggle('activa', tabActiva==='cv');
    $('sec-gremio').classList.toggle('activa', tabActiva==='gremio');
    actualizarFab();
  });
});
document.querySelectorAll('#segCV .seg').forEach(function(s){
  s.addEventListener('click', function(){
    vistaCV = s.dataset.vista;
    document.querySelectorAll('#segCV .seg').forEach(function(x){x.classList.toggle('activa', x===s);});

    '<div class="renglon"><span class="concepto"><strong>Compra del equipo</strong></span><span class="guia"></span><span class="monto">'+fmt(t.precioCompra)+'</span></div></div></details>' : '';

    '<div class="t-cab"><div><div class="t-titulo">'+esc(t.marca)+' '+esc(t.modelo)+'</div>'+

function tarjetaDesarme(t){
  const inv = inversion(t);
  const recuperado = (t.repuestos||[]).reduce(function(a,r){return a+r.monto;},0);
  const repHTML = (t.repuestos&&t.repuestos.length) ?
    '<details class="plegable"><summary>Repuestos vendidos ('+t.repuestos.length+')</summary><div class="lista-gastos">'+
    t.repuestos.map(function(r){return '<div class="renglon"><span class="concepto">'+esc(r.desc)+'<span class="fecha-r">'+fFecha(r.fecha)+'</span></span><span class="guia"></span><span class="monto verde-t">'+fmt(r.monto)+'</span></div>';}).join('')+'</div></details>' : '';
  return '<div class="tarjeta">'+
    '<div class="t-cab"><div><div class="t-titulo">'+esc(t.marca)+' '+esc(t.modelo)+'</div>'+
    '<div class="t-sub">Inversión total '+fmt(inv)+' · lleva recuperado '+fmt(recuperado)+'</div></div>'+
    '<span class="chip chip-ambar">Desarme</span></div>'+
    '<div class="datos-fila">'+
    '<div class="dato"><div class="mini-rotulo">Falta recuperar</div><div class="mini-monto num '+((t.costoRestante||0)>0?'ambar-t':'verde-t')+'">'+fmt(t.costoRestante)+'</div></div>'+
    '<div class="dato"><div class="mini-rotulo">Ganancia hasta hoy</div><div class="mini-monto num verde-t">'+fmt(Math.max(0,recuperado-inv))+'</div></div>'+
    '</div>'+ repHTML +
    '<div class="t-acciones">'+
    '<button class="btn btn-verde" onclick="abrirVentaRepuesto(\''+t.id+'\')">+ Venta de repuesto</button>'+
    '<button class="btn btn-blanco" onclick="finalizarDesarme(\''+t.id+'\')">Finalizar</button>'+
    '</div></div>';
}

function renderVendidos(cont){
  const vendidos = DB.telefonos.filter(function(t){return t.estado==='vendido';})
    .sort(function(a,b){ return (b.venta.fecha||'').localeCompare(a.venta.fecha||''); });
  if(!vendidos.length){ cont.innerHTML = '<div class="vacio"><strong>Todavía no vendiste ninguno</strong>Acá va a quedar el historial con la ganancia de cada venta.</div>'; return; }
  const meses = [];
  vendidos.forEach(function(t){ const m=mesDe(t.venta.fecha); if(m && meses.indexOf(m)<0) meses.push(m); });
  const sel = window._mesSel && meses.indexOf(window._mesSel)>=0 ? window._mesSel : meses[0];
  window._mesSel = sel;
  const delMes = vendidos.filter(function(t){return mesDe(t.venta.fecha)===sel;});
  const ganMes = delMes.reduce(function(a,t){return a+(t.venta.ganancia||0);},0);
  cont.innerHTML =
    '<select style="margin-bottom:12px" onchange="window._mesSel=this.value;render()">'+
    meses.map(function(m){return '<option value="'+m+'" '+(m===sel?'selected':'')+'>'+nomMes(m)+'</option>';}).join('')+'</select>'+
    '<div class="total-mes"><span class="rotulo">Ganancia de '+nomMes(sel)+' · '+delMes.length+' venta'+(delMes.length===1?'':'s')+'</span><span class="num">'+fmt(ganMes)+'</span></div>'+
    delMes.map(function(t){
      const v=t.venta;
      return '<div class="tarjeta"><div class="t-cab"><div><div class="t-titulo">'+esc(t.marca)+' '+esc(t.modelo)+'</div>'+
      '<div class="t-sub">'+(t.fueDesarme?'Desarmado y vendido por partes':'Vendido a '+esc(v.comprador||'—')+(v.telefono?(' · '+esc(v.telefono)):''))+' · '+fFecha(v.fecha)+'</div></div>'+
      '<span class="chip chip-gris">Vendido</span></div>'+
      '<div class="datos-fila">'+
      '<div class="dato"><div class="mini-rotulo">Inversión</div><div class="mini-monto num">'+fmt(v.inversion)+'</div></div>'+
      '<div class="dato"><div class="mini-rotulo">'+(t.fueDesarme?'Total repuestos':'Precio de venta')+'</div><div class="mini-monto num">'+fmt(v.precio)+'</div></div>'+
      '<div class="dato"><div class="mini-rotulo">Ganancia</div><div class="mini-monto num '+((v.ganancia||0)>=0?'verde-t':'rojo-t')+'">'+fmt(v.ganancia)+'</div></div>'+
      '</div></div>';
    }).join('');
}

// ---------- render gremio ----------
function renderGremio(){
  const G = DB.gremio;
  const enTaller = G.ordenes.filter(function(o){return o.estado==='observacion'||o.estado==='listo';});
  $('gTaller').textContent = enTaller.length;
  const mesAct = hoyISO().slice(0,7);
  const ganMes = G.ordenes.filter(function(o){return o.estado==='retirado' && mesDe(o.fechaRetiro)===mesAct;})
    .reduce(function(a,o){return a+((o.precio||0)-(o.costo||0));},0);
  $('gGanMes').textContent = fmt(ganMes);
  const debe = G.ordenes.filter(function(o){return o.estado==='retirado' && !o.pagado;})
    .reduce(function(a,o){return a+(o.precio||0);},0);
  $('gDebe').textContent = fmt(debe);

  // filtro clientes
  const selC = $('filtroCliente');
  const actual = selC.value;
  selC.innerHTML = '<option value="">Todos los clientes</option>' + G.clientes.map(function(c){
    return '<option value="'+esc(c.nombre)+'" '+(c.nombre===actual?'selected':'')+'>'+esc(c.nombre)+'</option>';
  }).join('');

  const fE = $('filtroEstado').value, fC = selC.value;
  let lista = G.ordenes.slice().reverse();
  if(fE==='taller') lista = lista.filter(function(o){return o.estado==='observacion'||o.estado==='listo';});
  else if(fE!=='todos') lista = lista.filter(function(o){return o.estado===fE;});
  if(fC) lista = lista.filter(function(o){return o.cliente===fC;});

  // resumen por cliente
  const rc = $('resumenCliente');
  if(fC){
    const todas = G.ordenes.filter(function(o){return o.cliente===fC;});
    const fact = todas.filter(function(o){return o.estado==='retirado';}).reduce(function(a,o){return a+(o.precio||0);},0);
    const deuda = todas.filter(function(o){return o.estado==='retirado'&&!o.pagado;}).reduce(function(a,o){return a+(o.precio||0);},0);
    rc.innerHTML = '<div class="total-mes"><span class="rotulo">'+esc(fC)+' · facturado '+fmt(fact)+'</span><span class="num '+(deuda>0?'':'')+'">'+(deuda>0?('debe '+fmt(deuda)):'al día ✓')+'</span></div>';
  } else rc.innerHTML='';

  $('listaGremio').innerHTML = lista.length ? lista.map(tarjetaOrden).join('') :
    '<div class="vacio"><strong>Nada por acá</strong>Cargá una orden nueva con el botón de abajo o cambiá el filtro.</div>';
}

};

    '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="chip '+est.chip+'">'+est.txt+'</span>'+

    '<div class="dato"><div class="mini-rotulo">Costo</div><div class="mini-monto num">'+fmt(o.costo)+'</div></div>'+
    '<div class="dato"><div class="mini-rotulo">Precio gremio</div><div class="mini-monto num">'+fmt(o.precio)+'</div></div>'+
    '<div class="dato"><div class="mini-rotulo">Ganancia</div><div class="mini-monto num '+(gan>=0?'verde-t':'rojo-t')+'">'+fmt(gan)+'</div></div>'+

window.previewGan = function(inv){
  const g = num($('vPrecio').value) - inv;
  const el=$('vGan'); el.textContent = fmt(g);
  el.parentElement.style.background = g>=0 ? 'var(--verde-suave)' : 'var(--rojo-suave)';
  el.parentElement.style.color = g>=0 ? 'var(--verde)' : 'var(--rojo)';
};
window.confVender = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  const precio = num($('vPrecio').value);
  if(precio<=0){ toast('Poné el precio de venta'); return; }
  const inv = inversion(t);
  const gan = precio - inv;
  const vuelveACaja = Math.min(precio, inv);   // recupero del costo
  t.estado='vendido';
  t.venta = { comprador:$('vComprador').value.trim(), telefono:$('vTel').value.trim(),
              fecha:$('vFecha').value||hoyISO(), precio:precio, inversion:inv, ganancia:gan };
  DB.caja += vuelveACaja;
  DB.ganancia += gan;
  DB.movimientos.push({id:nid(), fecha:t.venta.fecha, detalle:'Recupero venta '+t.marca+' '+t.modelo, monto:vuelveACaja, tipo:'ingreso'});
  guardar(); render(); cerrarSheet();
  toast(gan>=0 ? 'Vendido · ganancia '+fmt(gan) : 'Vendido con pérdida de '+fmt(-gan));
};

    '<div class="sheet-sub">'+esc(t.detalle||'')+'</div>'+
    '<div class="sheet-botones" style="flex-direction:column">'+
    '<button class="btn btn-blanco" onclick="abrirEditarTel(\''+id+'\')">✏️ Editar datos</button>'+
    '<button class="btn btn-blanco" onclick="marcarDesarme(\''+id+'\')">🔩 Pasar a desarme (vender por partes)</button>'+
    '<button class="btn btn-rojo-s" onclick="eliminarTel(\''+id+'\')">🗑 Anular compra (devuelve la plata a la caja)</button>'+
    '</div>'
  );
};
window.marcarDesarme = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  t.estado='desarme'; t.repuestos=[]; t.costoRestante=inversion(t);
  guardar(); render(); cerrarSheet(); toast('Pasado a desarme');
};
window.abrirVentaRepuesto = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  abrirSheet(
    '<div class="sheet-titulo">Venta de repuesto</div>'+
    '<div class="sheet-sub">'+esc(t.marca)+' '+esc(t.modelo)+' · falta recuperar '+fmt(t.costoRestante)+'. Primero se recupera el costo, lo que sobra es ganancia.</div>'+
    '<label>¿Qué repuesto vendiste?</label><input id="rDesc" placeholder="Ej: placa madre">'+
    '<label>Monto</label><input type="text" inputmode="numeric" id="rMonto" placeholder="0">'+
    '<div class="sheet-botones"><button class="btn btn-blanco" onclick="cerrarSheet()">Cancelar</button>'+
    '<button class="btn btn-verde" onclick="confVentaRepuesto(\''+id+'\')">Guardar venta</button></div>'
  );
};
window.confVentaRepuesto = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  const monto = num($('rMonto').value), desc=$('rDesc').value.trim();
  if(!desc || monto<=0){ toast('Completá el repuesto y el monto'); return; }
  t.repuestos.push({desc:desc, monto:monto, fecha:hoyISO()});
  const recupero = Math.min(monto, t.costoRestante||0);
  const gan = monto - recupero;
  t.costoRestante = (t.costoRestante||0) - recupero;
  DB.caja += recupero;
  DB.ganancia += gan;
  if(recupero>0) DB.movimientos.push({id:nid(), fecha:hoyISO(), detalle:'Recupero repuesto '+t.marca+' '+t.modelo, monto:recupero, tipo:'ingreso'});
  guardar(); render(); cerrarSheet(); toast('Venta guardada'+(gan>0?(' · ganancia '+fmt(gan)):''));
};
window.finalizarDesarme = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  const inv = inversion(t);
  const total = (t.repuestos||[]).reduce(function(a,r){return a+r.monto;},0);
  if(!confirm('¿Dar por terminado el desarme? Pasa al historial con ganancia final de '+fmt(total-inv)+'.')) return;
  t.estado='vendido'; t.fueDesarme=true;
  t.venta = { comprador:'', telefono:'', fecha:hoyISO(), precio:total, inversion:inv, ganancia:total-inv };
  if(t.costoRestante>0){ DB.ganancia -= t.costoRestante; t.costoRestante=0; } // costo no recuperado = pérdida
  guardar(); render(); toast('Desarme finalizado');
};
window.eliminarTel = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  const inv = t.estado==='desarme' ? (t.costoRestante||0) : inversion(t);
  if(!confirm('¿Anular la compra de '+t.marca+' '+t.modelo+'? Vuelven '+fmt(inv)+' a la caja y se borra el registro.')) return;
  DB.caja += inv;
  DB.movimientos.push({id:nid(), fecha:hoyISO(), detalle:'Anulación compra '+t.marca+' '+t.modelo, monto:inv, tipo:'ingreso'});
  DB.telefonos = DB.telefonos.filter(function(x){return x.id!==id;});
  guardar(); render(); cerrarSheet(); toast('Compra anulada');
};

// ================= EDITAR TELÉFONO =================
window.abrirEditarTel = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  abrirSheet(
    '<div class="sheet-titulo">Editar teléfono</div>'+
    '<div class="sheet-sub">El precio de compra no se toca desde acá para no desbalancear la caja. Si lo cargaste mal, anulá la compra y cargalo de nuevo.</div>'+
    '<div class="fila-2"><div><label>Marca</label><input id="eMarca" value="'+esc(t.marca)+'"></div>'+
    '<div><label>Modelo</label><input id="eModelo" value="'+esc(t.modelo)+'"></div></div>'+
    '<label>IMEI</label><input id="eImei" value="'+esc(t.imei)+'">'+
    '<label>Estado / detalle</label><input id="eDetalle" value="'+esc(t.detalle)+'">'+
    '<label>Comprado a</label><input id="eProv" value="'+esc(t.proveedor)+'">'+
    '<label>Precio de venta estimado</label><input type="text" inputmode="numeric" id="eEstimado" value="'+(t.estimado||'')+'">'+
    '<div class="sheet-botones"><button class="btn btn-blanco" onclick="cerrarSheet()">Cancelar</button>'+
    '<button class="btn btn-verde" onclick="confEditarTel(\''+id+'\')">Guardar cambios</button></div>'
  );
};
window.confEditarTel = function(id){
  const t = DB.telefonos.find(function(x){return x.id===id;}); if(!t) return;
  t.marca=$('eMarca').value.trim(); t.modelo=$('eModelo').value.trim();
  t.imei=$('eImei').value.trim(); t.detalle=$('eDetalle').value.trim();
  t.proveedor=$('eProv').value.trim(); t.estimado=num($('eEstimado').value);
  guardar(); render(); cerrarSheet(); toast('Cambios guardados');
};

// ================= GREMIO: NUEVA ORDEN =================
window.abrirNuevaOrden = function(){
  const dl = DB.gremio.clientes.map(function(c){return '<option value="'+esc(c.nombre)+'">';}).join('');
  abrirSheet(
    '<div class="sheet-titulo">Nueva orden · #'+String(DB.gremio.proxOrden).padStart(3,'0')+'</div>'+
    '<div class="sheet-sub">Reparación a gremio.</div>'+
    '<label>Cliente</label><input id="oCliente" list="dlClientes" placeholder="Nombre del cliente gremio" oninput="chequearCliente()">'+
    '<datalist id="dlClientes">'+dl+'</datalist>'+
    '<div id="campoWA"><label>WhatsApp del cliente</label><input id="oWA" inputmode="tel" placeholder="11 2345 6789"></div>'+
    '<div class="fila-2"><div><label>Marca</label><input id="oMarca" placeholder="Motorola"></div>'+
    '<div><label>Modelo</label><input id="oModelo" placeholder="G8"></div></div>'+
    '<label>¿Qué reparación se le hace?</label><input id="oRep" placeholder="Ej: cambio de módulo">'+
    '<div class="fila-2"><div><label>Costo nuestro</label><input type="text" inputmode="numeric" id="oCosto" placeholder="0" oninput="previewGanOrden()"></div>'+
    '<div><label>Precio gremio</label><input type="text" inputmode="numeric" id="oPrecio" placeholder="0" oninput="previewGanOrden()"></div></div>'+
    '<div class="gan-preview"><span>Ganancia</span><span class="num" id="oGan">$ 0</span></div>'+
    '<div class="sheet-botones"><button class="btn btn-blanco" onclick="cerrarSheet()">Cancelar</button>'+
    '<button class="btn btn-verde" onclick="confNuevaOrden()">Guardar orden</button></div>'
  );
  chequearCliente();
};
window.chequearCliente = function(){
  const nombre = $('oCliente').value.trim();
  const existe = DB.gremio.clientes.find(function(c){return c.nombre.toLowerCase()===nombre.toLowerCase();});
  $('campoWA').style.display = existe ? 'none' : 'block';
  if(existe) $('oWA').value = existe.whatsapp||'';
};
window.previewGanOrden = function(){
  const g = num($('oPrecio').value) - num($('oCosto').value);
  const el=$('oGan'); el.textContent=fmt(g);
  el.parentElement.style.background = g>=0 ? 'var(--verde-suave)' : 'var(--rojo-suave)';
  el.parentElement.style.color = g>=0 ? 'var(--verde)' : 'var(--rojo)';
};
window.confNuevaOrden = function(){
  const cliente=$('oCliente').value.trim(), marca=$('oMarca').value.trim(), modelo=$('oModelo').value.trim(), rep=$('oRep').value.trim();
  if(!cliente || !marca || !modelo || !rep){ toast('Completá cliente, equipo y reparación'); return; }
  let c = DB.gremio.clientes.find(function(x){return x.nombre.toLowerCase()===cliente.toLowerCase();});
  const wa = $('oWA').value.trim();
  if(!c){ DB.gremio.clientes.push({nombre:cliente, whatsapp:wa}); }
  else if(wa && !c.whatsapp){ c.whatsapp=wa; }
  DB.gremio.ordenes.push({
    id:nid(), orden:DB.gremio.proxOrden, cliente:cliente, marca:marca, modelo:modelo,
    reparacion:rep, costo:num($('oCosto').value), precio:num($('oPrecio').value),
    estado:'observacion', pagado:false, fechaIngreso:hoyISO()
  });
  DB.gremio.proxOrden++;
  guardar(); render(); cerrarSheet(); toast('Orden #'+String(DB.gremio.proxOrden-1).padStart(3,'0')+' cargada');
};

// ================= GREMIO: ESTADOS =================
function ordenPorId(id){ return DB.gremio.ordenes.find(function(o){return o.id===id;}); }
window.marcarListo = function(id){
  const o = ordenPorId(id); if(!o) return;
  o.estado='listo'; o.fechaListo=hoyISO();
  guardar(); render(); toast('Marcado como listo · avisale por WhatsApp');
};
window.marcarRetirado = function(id){
  const o = ordenPorId(id); if(!o) return;
  o.estado='retirado'; o.fechaRetiro=hoyISO();
  o.pagado = confirm('¿Te pagó '+fmt(o.precio)+'?\n\nAceptar = pagó · Cancelar = queda debiendo');
  guardar(); render(); toast(o.pagado ? 'Retirado y pagado ✓' : 'Retirado · quedó debiendo');
};
window.marcarPagado = function(id){
  const o = ordenPorId(id); if(!o) return;
  if(!confirm('¿Registrar el pago de '+fmt(o.precio)+' de '+o.cliente+'?')) return;
  o.pagado=true; o.fechaPago=hoyISO();
  guardar(); render(); toast('Pago registrado');
};
window.avisarWA = function(id){
  const o = ordenPorId(id); if(!o) return;
  const c = DB.gremio.clientes.find(function(x){return x.nombre.toLowerCase()===o.cliente.toLowerCase();});
  const numero = (c&&c.whatsapp)||'';
  if(!numero){ toast('Este cliente no tiene WhatsApp cargado · editá la orden'); return; }
  const equipo = o.marca+' '+o.modelo;
  let msj;
  if(o.estado==='sinarreglo'){
    msj = 'Hola '+o.cliente+'! Somos de *La Clínica del Celular* 📱\nRevisamos tu *'+equipo+'* (orden #'+String(o.orden).padStart(3,'0')+') y lamentablemente no tiene arreglo posible. Podés pasar a retirarlo cuando quieras.\n¡Gracias por confiar en nosotros!';
  } else {
    msj = 'Hola '+o.cliente+'! 👋 Somos de *La Clínica del Celular* 📱\nTu *'+equipo+'* (orden #'+String(o.orden).padStart(3,'0')+') ya está *listo para retirar* ✅\nReparación: '+o.reparacion+'\nTotal: '+fmt(o.precio)+'\n¡Te esperamos!';
  }
  window.open(waLink(numero, msj), '_blank');
};

// ================= GREMIO: MENÚ / EDITAR =================
window.abrirMenuOrden = function(id){
  const o = ordenPorId(id); if(!o) return;
  abrirSheet(
    '<div class="sheet-titulo">Orden #'+String(o.orden).padStart(3,'0')+'</div>'+
    '<div class="sheet-sub">'+esc(o.cliente)+' · '+esc(o.marca)+' '+esc(o.modelo)+'</div>'+
    '<div class="sheet-botones" style="flex-direction:column">'+
    '<button class="btn btn-blanco" onclick="abrirEditarOrden(\''+id+'\')">✏️ Editar orden</button>'+
    (o.estado!=='retirado' && o.estado!=='sinarreglo' ? '<button class="btn btn-blanco" onclick="marcarSinArreglo(\''+id+'\')">🚫 Marcar sin arreglo</button>' : '')+
    (o.estado==='sinarreglo' ? '<button class="btn btn-blanco" onclick="devolverATaller(\''+id+'\')">↩️ Volver a observación</button>' : '')+
    '<button class="btn btn-rojo-s" onclick="eliminarOrden(\''+id+'\')">🗑 Eliminar orden</button>'+
    '</div>'
  );
};
window.marcarSinArreglo = function(id){
  const o = ordenPorId(id); if(!o) return;
  o.estado='sinarreglo';
  guardar(); render(); cerrarSheet(); toast('Marcada sin arreglo');
};
window.devolverATaller = function(id){
  const o = ordenPorId(id); if(!o) return;
  o.estado='observacion';
  guardar(); render(); cerrarSheet(); toast('De vuelta en observación');
};
window.eliminarOrden = function(id){
  const o = ordenPorId(id); if(!o) return;
  if(!confirm('¿Eliminar la orden #'+String(o.orden).padStart(3,'0')+' de '+o.cliente+'? No se puede deshacer.')) return;
  DB.gremio.ordenes = DB.gremio.ordenes.filter(function(x){return x.id!==id;});
  guardar(); render(); cerrarSheet(); toast('Orden eliminada');
};
window.abrirEditarOrden = function(id){
  const o = ordenPorId(id); if(!o) return;
  const c = DB.gremio.clientes.find(function(x){return x.nombre.toLowerCase()===o.cliente.toLowerCase();});
  abrirSheet(
    '<div class="sheet-titulo">Editar orden #'+String(o.orden).padStart(3,'0')+'</div>'+
    '<label>Cliente</label><input id="eoCliente" value="'+esc(o.cliente)+'">'+
    '<label>WhatsApp del cliente</label><input id="eoWA" inputmode="tel" value="'+esc(c?c.whatsapp:'')+'">'+
    '<div class="fila-2"><div><label>Marca</label><input id="eoMarca" value="'+esc(o.marca)+'"></div>'+
    '<div><label>Modelo</label><input id="eoModelo" value="'+esc(o.modelo)+'"></div></div>'+
    '<label>Reparación</label><input id="eoRep" value="'+esc(o.reparacion)+'">'+
    '<div class="fila-2"><div><label>Costo nuestro</label><input type="text" inputmode="numeric" id="eoCosto" value="'+(o.costo||'')+'"></div>'+
    '<div><label>Precio gremio</label><input type="text" inputmode="numeric" id="eoPrecio" value="'+(o.precio||'')+'"></div></div>'+
    '<div class="sheet-botones"><button class="btn btn-blanco" onclick="cerrarSheet()">Cancelar</button>'+
    '<button class="btn btn-verde" onclick="confEditarOrden(\''+id+'\')">Guardar cambios</button></div>'
  );
};
window.confEditarOrden = function(id){
  const o = ordenPorId(id); if(!o) return;
  const nuevoCliente = $('eoCliente').value.trim(), wa=$('eoWA').value.trim();
  o.cliente=nuevoCliente; o.marca=$('eoMarca').value.trim(); o.modelo=$('eoModelo').value.trim();
  o.reparacion=$('eoRep').value.trim(); o.costo=num($('eoCosto').value); o.precio=num($('eoPrecio').value);
  let c = DB.gremio.clientes.find(function(x){return x.nombre.toLowerCase()===nuevoCliente.toLowerCase();});
  if(!c){ DB.gremio.clientes.push({nombre:nuevoCliente, whatsapp:wa}); }
  else { c.whatsapp = wa; }
  guardar(); render(); cerrarSheet(); toast('Orden actualizada');
};
</script>
